<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#17211e;--tx2:#5b6862;--bd:#dfe5e2;--pri:#0F6E56;--pri2:#e1f3ee;--ok:#1D9E75;--warn:#EF9F27;--bad:#D4537E;--sh:0 1px 3px rgba(0,0,0,.08)}
:root[data-theme=dark]{--bg:#101614;--card:#18211e;--tx:#e8efec;--tx2:#9aa8a2;--bd:#2a3733;--pri:#2fb58f;--pri2:#173a31;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
.wrap{max-width:640px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
header h1{font-size:20px;margin:0;color:var(--pri)}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.del{color:var(--bad);border-color:var(--bad)}
.next{background:var(--pri);color:#fff;border-radius:14px;padding:14px;margin-bottom:12px}
.next small{opacity:.85;display:block;font-size:12px}
.next b{font-size:20px;font-weight:600;display:block;margin:2px 0}
.next.late{background:var(--bad)}
.prog{height:6px;background:rgba(255,255,255,.3);border-radius:4px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:#fff}
.filters{display:flex;gap:6px;margin-bottom:6px}
.filters button{border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:4px 12px;font-size:13px;cursor:pointer}
.filters button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.ph{font-size:12px;font-weight:600;color:var(--tx2);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.row{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--sh)}
.row input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--pri);flex:none}
.row .m{flex:1;min-width:0}
.row .t{word-wrap:break-word}
.row.done .t{text-decoration:line-through;color:var(--tx2)}
.row .n{font-size:12px;color:var(--tx2);margin-top:2px;word-wrap:break-word}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap;display:inline-block;margin-top:4px;margin-right:4px}
.tag.ok{background:color-mix(in srgb,var(--ok) 25%,transparent)}
.tag.soon{background:color-mix(in srgb,var(--warn) 35%,transparent)}
.tag.late{background:color-mix(in srgb,var(--bad) 30%,transparent)}
.tag.done{background:var(--bd)}
.tag.chk{background:transparent;border:1px dashed var(--warn)}
.acts{display:flex;flex-direction:column;gap:4px}
.acts button{background:none;border:none;font-size:18px;padding:2px 6px;cursor:pointer;color:var(--tx2)}
.fab{position:fixed;right:18px;bottom:60px;width:54px;height:54px;border-radius:50%;background:var(--pri);color:#fff;border:none;font-size:30px;box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:pointer}
footer{text-align:center;font-size:11px;color:var(--tx2);margin:24px 0 0;line-height:1.6}
.empty{text-align:center;color:var(--tx2);padding:30px 0}
#modal,#pmodal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on,#pmodal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px;max-height:92vh;overflow:auto}
.sheet label{display:block;font-size:12px;color:var(--tx2);margin:10px 0 3px}
.sheet input[type=text],.sheet input[type=date],.sheet textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.sheet .chkl{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px}
.sheet .btns{display:flex;gap:8px;margin-top:14px}
.sheet .btns .btn{flex:1;padding:10px}
#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:50}
#loader.off{display:none}
.donut{width:46px;height:46px;border-radius:50%;border:6px solid var(--pri2);border-top-color:var(--pri);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.tabs{display:flex;gap:6px;margin:0 0 12px}
.tabs button{flex:1;padding:8px;border:1px solid var(--bd);background:var(--card);border-radius:10px;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.sum{display:flex;gap:6px;margin:0 0 10px}
.sum div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 8px;font-size:11px;color:var(--tx2)}
.sum b{display:block;font-size:18px;font-weight:600;color:var(--tx)}
.fub{background:color-mix(in srgb,var(--bad) 22%,transparent);border:1px solid var(--bad);border-radius:10px;padding:8px 10px;font-size:13px;margin:0 0 10px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:var(--sh)}
.pc.fu{border-color:var(--bad);border-width:2px}
.pc .top{display:flex;justify-content:space-between;align-items:center}
.pc .cat{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em}
.pc .ed{background:none;border:none;font-size:18px;padding:0 4px;cursor:pointer;color:var(--tx2)}
.pc .t{margin:2px 0;word-wrap:break-word}
.pc .src{font-size:12px;color:var(--tx2)}
.pc .n{font-size:12px;color:var(--tx2);margin-top:2px;word-wrap:break-word}
.pc .r2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0 6px}
.pc select{font-size:12px;padding:3px 6px;border-radius:8px;border:1px solid var(--bd);color:var(--tx)}
.s0{background:color-mix(in srgb,#888780 25%,transparent)}
.s1{background:color-mix(in srgb,#378ADD 28%,transparent)}
.s2{background:color-mix(in srgb,#EF9F27 38%,transparent)}
.s3{background:color-mix(in srgb,#1D9E75 30%,transparent)}
.pc .r3{display:flex;gap:6px;align-items:center}
.pc .r3 input{flex:1;min-width:0;font-size:13px;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.pc .r3 a{font-size:12px;padding:6px 9px;border:1px solid var(--bd);border-radius:8px;text-decoration:none;color:var(--tx);white-space:nowrap}
.pc .r3 a.hid{display:none}
.sheet select,.sheet input[type=tel]{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;display:none;z-index:30}
</style>

UiTM Penang", "Pengurusan UiTM Penang", 0, "Terangkan part-time, bimbingan online, komitmen 2027"], ["Kebenaran", "Kelulusan akses data rangkaian dan kepatuhan PDPA (metrik agregat sahaja)", "Pegawai PDPA / pengurusan", 0, "Jangan rekod kandungan trafik atau MAC peranti yang boleh dikenal pasti"], ["Kebenaran", "Permohonan etika REC UiTM, termasuk ukuran teknikal dan survei", "REC UiTM, melalui Dr Azlan", 0, "Wajib lulus sebelum survei diedar dan data dikumpul"], ["Persampelan", "Jumlah pelajar (199,488) dan staf (8,714 akademik, 12,753 pentadbiran)", "Sistem data pelajar dan HR", 3, "Pelajar aktif kampus UiTM, tidak termasuk kolej bersekutu"], ["Persampelan", "Pecahan staf akademik dan pentadbiran mengikut kampus", "Bahagian Sumber Manusia", 0, "Untuk agihan sampel staf ikut kampus"], ["Persampelan", "Kaedah edar survei kepada pelajar dan staf semua kampus", "Bahagian Digital / HEP / HR", 0, "Edar 800-1,000 borang pelajar untuk dapat 384 jawapan"], ["Perbincangan", "Bincang skop kajian teknikal dan reka bentuk kajian", "Dr Azlan (SV1)", 0, "Dr Azlan tanya sama ada ada kajian teknikal"]];
const $=id=>document.getElementById(id);
let items=[],prep=[],pEditId=null,set={theme:'system',lang:'ms',filter:'all',tab:'check',pf:'all'},editId=null,dip=null;
const t=()=>L[set.lang];
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function seed(){return SEED.map((s,i)=>({id:'s'+i,phase:s[0],title:s[1],date:s[2],check:!!s[3],note:s[4],done:false}))}
function load(){try{items=JSON.parse(localStorage.getItem(KEY));if(!Array.isArray(items))throw 0}catch(e){items=seed();save()}try{Object.assign(set,JSON.parse(localStorage.getItem(SKEY))||{})}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function saveSet(){try{localStorage.setItem(SKEY,JSON.stringify(set))}catch(e){}}
function today(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function pd(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function diff(s){return Math.round((pd(s)-today())/864e5)}
function fmt(s){return pd(s).toLocaleDateString(set.lang==='ms'?'ms-MY':'en-GB',{day:'numeric',month:'short',year:'numeric'})}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function applyTheme(){const d=set.theme==='dark'||(set.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.querySelector('meta[name=theme-color]').content=d?'#101614':'#0F6E56'}
function status(it){if(it.done)return{c:'done',x:t().done};const d=diff(it.date);if(d<0)return{c:'late',x:t().lateN.replace('{n}',-d)};if(d===0)return{c:'soon',x:t().today};if(d===1)return{c:'soon',x:t().tmr};if(d<=14)return{c:'soon',x:d+' '+t().days};return{c:'ok',x:d+' '+t().days}}
function renderCheck(){
  const T=t();
  $('bTheme').textContent=T.theme[set.theme];$('bLang').textContent=set.lang==='ms'?'BM':'EN';
  $('bInstall').textContent=T.install;$('bExp').textContent=T.exp;$('bImp').textContent=T.imp;$('bRst').textContent=T.rst;$('fab').setAttribute('aria-label',T.add);
  $('filters').innerHTML=['all','todo','done'].map(f=>`<button data-f="${f}" class="${set.filter===f?'on':''}">${T[f]}</button>`).join('');
  const pend=items.filter(i=>!i.done).sort((a,b)=>a.date.localeCompare(b.date));
  const dn=items.filter(i=>i.done).length;
  let nx='';
  if(pend.length){const n=pend[0],s=status(n);nx=`<div class="next ${diff(n.date)<0?'late':''}"><small>${T.next}</small><b>${esc(n.title)}</b><small>${fmt(n.date)} · ${s.x}</small><div class="prog"><i style="width:${items.length?dn/items.length*100:0}%"></i></div><small style="margin-top:4px">${T.prog.replace('{a}',dn).replace('{b}',items.length)}</small></div>`}
  else if(items.length)nx=`<div class="next"><b>${T.allDone}</b></div>`;
  $('next').innerHTML=nx;
  let vis=items.filter(i=>set.filter==='all'||(set.filter==='todo'?!i.done:i.done));
  if(!vis.length){$('list').innerHTML=`<div class="empty">${T.none}</div>`;return}
  const ph=[];items.forEach(i=>{if(!ph.includes(i.phase))ph.push(i.phase)});
  let h='';
  ph.forEach(p=>{const g=vis.filter(i=>i.phase===p).sort((a,b)=>a.date.localeCompare(b.date));if(!g.length)return;
    h+=`<div class="ph">${esc(p)}</div>`;
    g.forEach(i=>{const s=status(i);
      h+=`<div class="row ${i.done?'done':''}" data-id="${i.id}"><input type="checkbox" ${i.done?'checked':''} data-a="tog"><div class="m"><div class="t">${esc(i.title)}</div>${i.note?`<div class="n">${esc(i.note)}</div>`:''}<span class="tag ${s.c}">${fmt(i.date)} · ${s.x}</span>${i.check&&!i.done?`<span class="tag chk">${T.check}</span>`:''}</div><div class="acts"><button data-a="edit" aria-label="edit">✎</button></div></div>`});
  });
  $('list').innerHTML=h;
}

function pseed(){return PSEED.map((x,i)=>({id:'p'+i,cat:x[0],title:x[1],src:x[2],st:x[3],name:'',tel:'',asked:'',note:x[4]}))}
function pload(){try{prep=JSON.parse(localStorage.getItem(PKEY));if(!Array.isArray(prep))throw 0}catch(e){prep=pseed();psave()}}
function psave(){try{localStorage.setItem(PKEY,JSON.stringify(prep))}catch(e){}}
function tstr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pDays(p){return p.st===2&&p.asked?-diff(p.asked):null}
function pFu(p){const d=pDays(p);return d!==null&&d>=7}
function waNum(s){let n=String(s||'').replace(/\D/g,'');if(n.startsWith('0'))n='6'+n;return n}
function updLinks(card,p){const n=waNum(p.tel),ok=n.length>=9;const w=card.querySelector('.wa'),c=card.querySelector('.cl');w.href='https://wa.me/'+n;c.href='tel:+'+n;w.classList.toggle('hid',!ok);c.classList.toggle('hid',!ok)}
function renderPrep(){
  const T=t(),cats=[];prep.forEach(p=>{if(!cats.includes(p.cat))cats.push(p.cat)});
  if(set.pf!=='all'&&!cats.includes(set.pf))set.pf='all';
  const fu=prep.filter(pFu).length;
  $('tabs').innerHTML=`<button data-tab="check" class="${set.tab==='check'?'on':''}">${T.tabC}</button><button data-tab="prep" class="${set.tab==='prep'?'on':''}">${T.tabP}${fu?' ('+fu+')':''}</button>`;
  $('vCheck').style.display=set.tab==='check'?'':'none';
  $('vPrep').style.display=set.tab==='prep'?'':'none';
  let h=`<div class="sum">${[3,2,1,0].map(k=>`<div>${T.pst[k]}<b>${prep.filter(p=>p.st===k).length}</b></div>`).join('')}</div>`;
  if(fu)h+=`<div class="fub">${T.fuB.replace('{n}',fu)}</div>`;
  h+=`<div class="filters" style="flex-wrap:wrap">${['all'].concat(cats).map(c=>`<button data-pf="${esc(c)}" class="${set.pf===c?'on':''}">${c==='all'?T.pAll:esc(c)}</button>`).join('')}</div>`;
  const vis=prep.filter(p=>set.pf==='all'||p.cat===set.pf);
  if(!vis.length)h+=`<div class="empty">${T.pNone}</div>`;
  vis.forEach(p=>{const d=pDays(p),f=pFu(p);
    h+=`<div class="pc ${f?'fu':''}" data-id="${p.id}"><div class="top"><div class="cat">${esc(p.cat)}</div><button class="ed" data-a="pedit" aria-label="edit">✎</button></div><div class="t">${esc(p.title)}</div><div class="src">${T.pFrom}: ${esc(p.src)}</div>${p.note?`<div class="n">${esc(p.note)}</div>`:''}<div class="r2"><select class="s${p.st}" data-a="pst">${T.pst.map((x,j)=>`<option value="${j}" ${j===p.st?'selected':''}>${x}</option>`).join('')}</select>${p.asked?`<span class="tag ${f?'late':'ok'}">${T.pAsked} ${fmt(p.asked)}${d!==null?' · '+(f?T.fuN.replace('{n}',d):d+' '+T.pdays):''}</span>`:''}</div><div class="r3"><input type="text" placeholder="${T.pName}" value="${esc(p.name)}" data-k="name"><input type="tel" placeholder="${T.pPhone}" value="${esc(p.tel)}" data-k="tel" inputmode="tel"><a class="wa hid" target="_blank" rel="noopener">${T.wa}</a><a class="cl hid">${T.call}</a></div></div>`});
  $('vPrep').innerHTML=h;
  $('vPrep').querySelectorAll('.pc').forEach(c=>updLinks(c,prep.find(p=>p.id===c.dataset.id)));
}
function render(){renderCheck();renderPrep()}
function openP(id){
  const T=t();pEditId=id;const p=prep.find(x=>x.id===id);
  $('pmTitle').textContent=p?T.pEdit:T.pAdd;
  [['plT','pT'],['plC','pC'],['plS','pS'],['plSt','pSt'],['plNm','pNm'],['plPh','pPh'],['plAk','pAk'],['plNo','pNo']].forEach(x=>$(x[0]).textContent=T[x[1]]);
  $('pSave').textContent=T.save;$('pDel').textContent=T.del;$('pCan').textContent=T.can;
  const cats=[];prep.forEach(x=>{if(!cats.includes(x.cat))cats.push(x.cat)});
  $('pcl').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');
  $('pSt').innerHTML=T.pst.map((x,j)=>`<option value="${j}">${x}</option>`).join('');
  $('pT').value=p?p.title:'';$('pC').value=p?p.cat:(set.pf!=='all'?set.pf:(cats[0]||''));$('pS').value=p?p.src:'';
  $('pSt').value=p?p.st:0;$('pNm').value=p?p.name:'';$('pPh').value=p?p.tel:'';$('pAk').value=p?p.asked:'';$('pNo').value=p?p.note:'';
  $('pDel').style.display=p?'':'none';
  $('pmodal').classList.add('on');
}
function closeP(){$('pmodal').classList.remove('on');pEditId=null}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){set.tab=b.dataset.tab;saveSet();render();scrollTo(0,0)}});
$('vPrep').addEventListener('click',e=>{
  const pf=e.target.dataset.pf;if(pf!==undefined){set.pf=pf;saveSet();render();return}
  if(e.target.dataset.a==='pedit')openP(e.target.closest('.pc').dataset.id);
});
$('vPrep').addEventListener('change',e=>{
  const card=e.target.closest('.pc');if(!card)return;const p=prep.find(x=>x.id===card.dataset.id);
  if(e.target.dataset.a==='pst'){p.st=+e.target.value;if(p.st===2&&!p.asked)p.asked=tstr();psave();render()}
  else if(e.target.dataset.k){p[e.target.dataset.k]=e.target.value.trim();psave();updLinks(card,p)}
});
$('pCan').onclick=closeP;
$('pmodal').addEventListener('click',e=>{if(e.target===$('pmodal'))closeP()});
$('pSave').onclick=()=>{
  const ti=$('pT').value.trim();if(!ti){toast(t().pNeed);return}
  const o={title:ti,cat:$('pC').value.trim()||'—',src:$('pS').value.trim(),st:+$('pSt').value,name:$('pNm').value.trim(),tel:$('pPh').value.trim(),asked:$('pAk').value,note:$('pNo').value.trim()};
  if(o.st===2&&!o.asked)o.asked=tstr();
  if(pEditId)Object.assign(prep.find(x=>x.id===pEditId),o);else prep.push(Object.assign({id:uid()},o));
  psave();closeP();render();toast(t().saved);
};
$('pDel').onclick=()=>{if(confirm(t().pDelq)){prep=prep.filter(x=>x.id!==pEditId);psave();closeP();render()}};
function openM(id){
  const T=t();editId=id;const it=items.find(i=>i.id===id);
  $('mTitle').textContent=it?T.edit:T.add;
  $('lT').textContent=T.ft;$('lP').textContent=T.fp;$('lD').textContent=T.fd;$('lC').textContent=T.fc;$('lN').textContent=T.fn;
  $('bSave').textContent=T.save;$('bCal').textContent=T.cal;$('bDel').textContent=T.del;$('bCan').textContent=T.can;
  const phs=[];items.forEach(i=>{if(!phs.includes(i.phase))phs.push(i.phase)});
  $('phl').innerHTML=phs.map(p=>`<option value="${esc(p)}">`).join('');
  $('fT').value=it?it.title:'';$('fP').value=it?it.phase:(phs[0]||'');$('fD').value=it?it.date:'';$('fC').checked=it?it.check:false;$('fN').value=it?it.note:'';
  $('bDel').style.display=it?'':'none';$('bCal').style.display=it?'':'none';
  $('modal').classList.add('on');
}
function closeM(){$('modal').classList.remove('on');editId=null}
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function ics(it){
  const d=it.date.replace(/-/g,'');const n=new Date(pd(it.date).getTime()+864e5);
  const e=n.getFullYear()+String(n.getMonth()+1).padStart(2,'0')+String(n.getDate()).padStart(2,'0');
  const x=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const r=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MyMaster//FaridAssamani//EN','BEGIN:VEVENT','UID:'+it.id+'@mymaster','DTSTAMP:'+new Date().toISOString().replace(/[-:]|\.\d{3}/g,''),'DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+e,'SUMMARY:'+x('MyMaster: '+it.title),'DESCRIPTION:'+x(it.note||it.phase),'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+x(it.title),'END:VALARM','END:VEVENT','END:VCALENDAR'];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.join('\r\n')],{type:'text/calendar'}));a.download='mymaster-'+it.date+'.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
$('list').addEventListener('click',e=>{
  const row=e.target.closest('.row');if(!row)return;const id=row.dataset.id,a=e.target.dataset.a;
  if(a==='tog'){const it=items.find(i=>i.id===id);it.done=e.target.checked;save();render()}
  else if(a==='edit')openM(id);
});
$('filters').addEventListener('click',e=>{const f=e.target.dataset.f;if(f){set.filter=f;saveSet();render()}});
$('fab').onclick=()=>set.tab==='prep'?openP(null):openM(null);
$('bCan').onclick=closeM;
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeM()});
$('bSave').onclick=()=>{
  const ti=$('fT').value.trim(),d=$('fD').value;if(!ti||!d){toast(t().need);return}
  const o={title:ti,phase:$('fP').value.trim()||'—',date:d,check:$('fC').checked,note:$('fN').value.trim()};
  if(editId){Object.assign(items.find(i=>i.id===editId),o)}else items.push(Object.assign({id:uid(),done:false},o));
  save();closeM();render();toast(t().saved);
};
$('bDel').onclick=()=>{if(confirm(t().delq)){items=items.filter(i=>i.id!==editId);save();closeM();render()}};
$('bCal').onclick=()=>{const it=items.find(i=>i.id===editId);if(it)ics(it)};
$('bTheme').onclick=()=>{const o=['system','light','dark'];set.theme=o[(o.indexOf(set.theme)+1)%3];saveSet();applyTheme();render()};
$('bLang').onclick=()=>{set.lang=set.lang==='ms'?'en':'ms';document.documentElement.lang=set.lang==='ms'?'ms':'en';saveSet();render()};
$('bExp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'mymaster',version:VER,items,prep},null,2)],{type:'application/json'}));a.download='mymaster-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$('bImp').onclick=()=>$('fImp').click();
$('fImp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{
  $('loader').classList.remove('off');
  setTimeout(()=>{try{const j=JSON.parse(r.result);const a=Array.isArray(j)?j:j.items,pp=Array.isArray(j)?null:j.prep;if(!Array.isArray(a)&&!Array.isArray(pp))throw 0;
    if(Array.isArray(a)){if(a.some(i=>!i.title||!i.date))throw 0;items=a.map(i=>({id:i.id||uid(),phase:i.phase||'—',title:String(i.title),date:i.date,check:!!i.check,note:i.note||'',done:!!i.done}));save()}
    if(Array.isArray(pp)){if(pp.some(i=>!i.title))throw 0;prep=pp.map(i=>({id:i.id||uid(),cat:i.cat||'—',title:String(i.title),src:i.src||'',st:[0,1,2,3].includes(+i.st)?+i.st:0,name:i.name||'',tel:i.tel||'',asked:i.asked||'',note:i.note||''}));psave()}
    render();toast(t().impok)}catch(x){toast(t().imperr)}$('loader').classList.add('off')},500)};r.readAsText(f);e.target.value=''};
$('bRst').onclick=()=>{if(set.tab==='prep'){if(confirm(t().pRstq)){prep=pseed();psave();render()}}else if(confirm(t().rstq)){items=seed();save();render()}};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('bInstall').style.display=''});
$('bInstall').onclick=async()=>{if(dip){dip.prompt();await dip.userChoice;dip=null;$('bInstall').style.display='none'}else toast(t().iosh)};
addEventListener('appinstalled',()=>$('bInstall').style.display='none');
if(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone)$('bInstall').style.display='';
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(set.theme==='system')applyTheme()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
load();pload();document.documentElement.lang=set.lang==='ms'?'ms':'en';applyTheme();render();
setTimeout(()=>$('loader').classList.add('off'),500);
</script>
</body>
